<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qafila Stay Hotel - Guests</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #1e3c72;
            color: white;
            padding-top: 25px;
        }

        .logo {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            padding: 0 10px 30px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin: 5px 12px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2a5298;
        }

        /* Main */
        .main {
            margin-left: 240px;
            padding: 25px;
        }

        .topbar {
            background: white;
            padding: 18px 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .topbar h1 {
            color: #1e3c72;
        }

        /* Form */
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .form-box h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #1e3c72;
        }

        .add-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #16305c;
        }

        /* Table */
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            color: #1e3c72;
        }

        .search {
            width: 230px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f4f8;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        /* Mobile */
        @media (max-width: 900px) {
            .form-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                padding: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .table-box {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        🏨 Qafila Stay Hotel
    </div>

    <ul class="menu">

        <li>
            <a href="dashboard.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="rooms.html">
                🛏️ Rooms
            </a>
        </li>

        <li>
            <a href="guests.html" class="active">
                👤 Guests
            </a>
        </li>

        <li>
            <a href="bookings.html">
                📅 Bookings
            </a>
        </li>

        <li>
            <a href="billing.html">
                💰 Billing
            </a>
        </li>

        <li>
            <a href="#" onclick="logout()">
                🚪 Logout
            </a>
        </li>

    </ul>

</div>


<!-- MAIN -->

<div class="main">

    <div class="topbar">
        <h1>Guests Management</h1>
    </div>


    <!-- ADD GUEST -->

    <div class="form-box">

        <h2>Add New Guest</h2>

        <form id="guestForm">

            <div class="form-row">

                <div>
                    <label>Guest Name</label>
                    <input
                        type="text"
                        id="guestName"
                        placeholder="Enter guest name"
                        required
                    >
                </div>

                <div>
                    <label>Phone Number</label>
                    <input
                        type="tel"
                        id="guestPhone"
                        placeholder="Enter phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >
                </div>

                <div>
                    <label>Email</label>
                    <input
                        type="email"
                        id="guestEmail"
                        placeholder="Enter email"
                    >
                </div>

                <div>
                    <label>ID Proof</label>

                    <select id="idProof" required>
                        <option value="">Select ID Proof</option>
                        <option value="Aadhaar Card">Aadhaar Card</option>
                        <option value="Passport">Passport</option>
                        <option value="Driving License">
                            Driving License
                        </option>
                        <option value="Voter ID">Voter ID</option>
                    </select>
                </div>

                <div>
                    <label>ID Number</label>

                    <input
                        type="text"
                        id="idNumber"
                        placeholder="Enter ID number"
                        required
                    >
                </div>

                <div>
                    <label>Room Number</label>

                    <input
                        type="text"
                        id="roomNumber"
                        placeholder="e.g. 101"
                        required
                    >
                </div>

                <div>
                    <label>Check-In Date</label>

                    <input
                        type="date"
                        id="checkIn"
                        required
                    >
                </div>

                <div>
                    <label>Check-Out Date</label>

                    <input
                        type="date"
                        id="checkOut"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="add-btn">
                + Add Guest
            </button>

        </form>

    </div>


    <!-- GUEST TABLE -->

    <div class="table-box">

        <div class="table-header">

            <h2>All Guests</h2>

            <input
                type="text"
                id="searchGuest"
                class="search"
                placeholder="Search guest..."
                onkeyup="displayGuests()"
            >

        </div>


        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>ID Proof</th>
                    <th>Room</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="guestTableBody"></tbody>

        </table>

    </div>

</div>


<script>

    /* =========================
       LOGIN CHECK
    ========================= */

    const loggedInUser =
        JSON.parse(localStorage.getItem("loggedInUser"));

    if (!loggedInUser) {

        window.location.href = "login.html";

    }


    /* =========================
       GET GUESTS
    ========================= */

    let guests =
        JSON.parse(localStorage.getItem("hotelGuests")) || [];


    /* =========================
       ADD GUEST
    ========================= */

    document
        .getElementById("guestForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const name =
                document.getElementById("guestName").value.trim();

            const phone =
                document.getElementById("guestPhone").value.trim();

            const email =
                document.getElementById("guestEmail").value.trim();

            const idProof =
                document.getElementById("idProof").value;

            const idNumber =
                document.getElementById("idNumber").value.trim();

            const roomNumber =
                document.getElementById("roomNumber").value.trim();

            const checkIn =
                document.getElementById("checkIn").value;

            const checkOut =
                document.getElementById("checkOut").value;


            /* Date validation */

            if (checkOut < checkIn) {

                alert("Check-out date cannot be before check-in date.");

                return;

            }


            /* Create guest */

            const newGuest = {

                id: Date.now(),

                name: name,

                phone: phone,

                email: email,

                idProof: idProof,

                idNumber: idNumber,

                roomNumber: roomNumber,

                checkIn: checkIn,

                checkOut: checkOut

            };


            guests.push(newGuest);


            /* Save */

            localStorage.setItem(
                "hotelGuests",
                JSON.stringify(guests)
            );


            /* Reset form */

            document.getElementById("guestForm").reset();


            /* Refresh table */

            displayGuests();


            alert("Guest added successfully!");

        });


    /* =========================
       DISPLAY GUESTS
    ========================= */

    function displayGuests() {

        const tableBody =
            document.getElementById("guestTableBody");

        const search =
            document
                .getElementById("searchGuest")
                .value
                .toLowerCase();


        tableBody.innerHTML = "";


        const filteredGuests =
            guests.filter(function(guest) {

                return (

                    guest.name.toLowerCase().includes(search) ||

                    guest.phone.includes(search) ||

                    guest.email.toLowerCase().includes(search) ||

                    guest.roomNumber.toLowerCase().includes(search)

                );

            });


        if (filteredGuests.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="8" style="text-align:center;">
                        No guests found
                    </td>
                </tr>
            `;

            return;
        }


        filteredGuests.forEach(function(guest) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${guest.name}</td>

                <td>${guest.phone}</td>

                <td>${guest.email || "-"}</td>

                <td>
                    ${guest.idProof}<br>
                    ${guest.idNumber}
                </td>

                <td>${guest.roomNumber}</td>

                <td>${guest.checkIn}</td>

                <td>${guest.checkOut}</td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteGuest(${guest.id})">

                        Delete

                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        });

    }


    /* =========================
       DELETE GUEST
    ========================= */

    function deleteGuest(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this guest?");


        if (!confirmDelete) {
            return;
        }


        guests =
            guests.filter(function(guest) {

                return guest.id !== id;

            });


        localStorage.setItem(
            "hotelGuests",
            JSON.stringify(guests)
        );


        displayGuests();

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        const confirmLogout =
            confirm("Are you sure you want to logout?");


        if (confirmLogout) {

            localStorage.removeItem("loggedInUser");

            window.location.href = "login.html";

        }

    }


    /* =========================
       INITIAL LOAD
    ========================= */

    displayGuests();

</script>

</body>
</html>
