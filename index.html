<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qafila Stay Hotel - Login</title>

    <style>
        * {
           /* Qafila Stay Hotel Background */
body {
    background:
        linear-gradient(rgba(97, 212, 230, 0.45), rgba(187, 225, 136, 0.366)),
        url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
     
}

/* Hotel Name */
.hotel-name {
    position: fixed;
    left: 8%;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 2px 3px 10px rgba(0,0,0,0.7);
    z-index: 1;
}

/* Login Box ko side me */
.login-container {
    margin-left: auto;
    margin-right: 8%;
    position: relative;
    z-index: 2;
}

/* Mobile */
@media (max-width: 768px) {
    .hotel-name {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        text-align: center;
        font-size: 35px;
        padding: 30px 10px 15px;
    }

    .login-container {
        margin: 20px auto;
        width: 90%;
    }
}
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .login-box h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 8px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #1e3c72;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16305c;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #1e3c72;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Qafila Stay Hotel</h1>
        <p>Login to your account</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">Login</button>

            <div id="message"></div>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
